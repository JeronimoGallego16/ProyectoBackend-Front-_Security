<mat-toolbar class="topbar gap-2">


  <!-- Mobile Menu -->
  @if(!showToggle) {
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="flex justify-center">
    <i class="iconify flex" data-icon="solar:hamburger-menu-linear"></i>
  </button>
  }

  <span class="flex-auto"></span>

  @if (options.theme === 'light') {
    <button
      mat-icon-button
      type="button"
      aria-label="Switch to dark theme"
      class="flex justify-center"
      (click)="setLightDark('dark')"
    >
      <i-tabler class="flex" [name]="'moon'"></i-tabler>
    </button>
  } @else {
    <button
      mat-icon-button
      type="button"
      aria-label="Switch to light theme"
      class="flex justify-center"
      (click)="setLightDark('light')"
    >
      <i-tabler class="flex" [name]="'sun'"></i-tabler>
    </button>
  }

  <button mat-icon-button extended [matMenuTriggerFor]="profilemenu" aria-label="Profile menu"
    class="flex! items-center justify-center profile-btn-dd">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-full object-cover size-9! profile-dd" alt="Profile" />
  </button>
  <mat-menu #profilemenu="matMenu" class="cardWithShadow">
    <button mat-menu-item disabled>
      <mat-icon class="flex items-center"><i data-icon="solar:shield-user-line-duotone"
          class="iconify size-5.5!"></i></mat-icon>My Profile
    </button>

    <div class="px-3 mt-3">
      <button
        type="button"
        mat-stroked-button
        class="w-full"
        [disabled]="isLoggingOut"
        (click)="logout()"
      >
        {{ isLoggingOut ? 'Logging out...' : 'Logout' }}
      </button>
    </div>
  </mat-menu>
</mat-toolbar>
