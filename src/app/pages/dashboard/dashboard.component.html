<div class="min-h-full px-4 py-6 sm:px-6 lg:px-8">
  <div class="mb-8">
    <h1 class="mb-2 text-3xl font-bold text-gray-900">Welcome, {{ userName }}!</h1>
    <p class="text-gray-500">Access the system modules quickly.</p>
  </div>

  @if (cards.length > 0) {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (card of cards; track card.route) {
        <button
          type="button"
          class="dashboard-card group h-full cursor-pointer overflow-hidden rounded-lg text-left shadow-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
          (click)="navigateTo(card.route)"
        >
          <div class="bg-gradient-to-br p-6 text-white {{ card.color }}">
            <div class="flex items-center justify-between">
              <mat-icon class="text-3xl">{{ card.icon }}</mat-icon>
              <mat-icon class="opacity-0 transition-all group-hover:translate-x-1 group-hover:opacity-100">
                chevron_right
              </mat-icon>
            </div>
          </div>
          <div class="bg-white p-6">
            <h2 class="mb-2 text-base font-bold text-gray-900">{{ card.title }}</h2>
            <p class="text-sm text-gray-500">{{ card.description }}</p>
          </div>
        </button>
      }
    </div>
  } @else {
    <div class="rounded-lg border border-gray-200 bg-white p-8 text-center">
      <mat-icon class="mb-3 text-5xl text-gray-400">dashboard</mat-icon>
      <p class="text-gray-600">There are no administrative modules available for your role.</p>
    </div>
  }
</div>
