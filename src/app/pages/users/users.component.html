<div class="p-6">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">Users</h1>
    <button mat-flat-button color="primary" [disabled]="isLoading" (click)="onCreateClick()">
      <mat-icon>add</mat-icon>
      New user
    </button>
  </div>

  @if (showForm) {
    <div class="mb-6">
      <app-dynamic-form
        [form]="userForm"
        [fields]="isEditing ? editFields : createFields"
        [isEditing]="isEditing"
        [isLoading]="isLoading"
        (submitted)="onSubmit()"
        (cancelled)="cancelForm()"
      ></app-dynamic-form>
    </div>
  }

  @if (isLoading && !showForm) {
    <div class="flex justify-center py-6">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (!showForm) {
    <app-data-table
      [data]="users"
      [columns]="columns"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    ></app-data-table>
  }

  <app-confirm-dialog
    [open]="confirmDeleteOpen"
    [isLoading]="isLoading"
    title="Delete user"
    [message]="pendingDeleteUser ? 'Are you sure you want to delete user #' + pendingDeleteUser.id + ' - ' + pendingDeleteUser.name + '?' : 'Are you sure?'"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  ></app-confirm-dialog>

  <app-detail-dialog
    [open]="detailOpen"
    title="User details"
    [data]="selectedUser"
    [fields]="detailFields"
    (close)="onCloseDetail()"
  ></app-detail-dialog>
</div>
