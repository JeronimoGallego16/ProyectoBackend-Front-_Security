<div class="p-6">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">Users</h1>
    <button mat-flat-button color="primary" [disabled]="isLoading" (click)="onCreateClick()">
      <mat-icon>add</mat-icon>
      New user
    </button>
  </div>

  @if (selectedUser) {
    <section class="mb-6 rounded-lg border border-gray-200 bg-gray-50 p-4" aria-labelledby="user-details-title">
      <h2 id="user-details-title" class="mb-2 text-lg font-semibold text-gray-900">User details</h2>
      <p class="text-sm text-gray-700"><strong>ID:</strong> {{ selectedUser.id }}</p>
      <p class="text-sm text-gray-700"><strong>Name:</strong> {{ selectedUser.name }}</p>
      <p class="text-sm text-gray-700"><strong>Email:</strong> {{ selectedUser.email }}</p>
      <div class="mt-4 flex justify-end">
        <button mat-stroked-button type="button" (click)="closeDetails()">Back to users</button>
      </div>
    </section>
  }

  @if (showForm) {
    <div class="mb-6">
      <app-dynamic-form
        [form]="userForm"
        [fields]="isEditing ? editFields : createFields"
        [isEditing]="isEditing"
        [isLoading]="isLoading"
        (submitted)="onSubmit()"
        (cancelled)="cancelForm()"
      ></app-dynamic-form>
    </div>
  }

  @if (isLoading && !showForm) {
    <div class="flex justify-center py-6">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (!showForm) {
    <app-data-table
      [data]="users"
      [columns]="columns"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    ></app-data-table>
  }

  <app-confirm-dialog
    [open]="confirmDeleteOpen"
    [isLoading]="isLoading"
    title="Delete user"
    [message]="pendingDeleteUser ? 'Are you sure you want to delete user #' + pendingDeleteUser.id + ' - ' + pendingDeleteUser.name + '?' : 'Are you sure?'"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  ></app-confirm-dialog>
</div>
