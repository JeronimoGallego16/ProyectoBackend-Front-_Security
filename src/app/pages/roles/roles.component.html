<div class="p-6">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold text-gray-800">Roles</h1>
    <button mat-flat-button color="primary" (click)="onCreateClick()">
      <mat-icon>add</mat-icon>
      New Role
    </button>
  </div>

  @if (showForm) {
    <mat-card class="mb-6">
      <mat-card-content>
        <form
          [formGroup]="roleForm"
          (ngSubmit)="onSubmit()"
          class="grid gap-4 pt-2"
        >
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input
              matInput
              formControlName="name"
              placeholder="Role name"
            />
            @if (roleForm.get('name')?.invalid && roleForm.get('name')?.touched) {
              <mat-error>Name is required</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <input
              matInput
              formControlName="description"
              placeholder="Role description"
            />
            @if (
              roleForm.get('description')?.invalid &&
              roleForm.get('description')?.touched
            ) {
              <mat-error>Description is required</mat-error>
            }
          </mat-form-field>

          <div class="flex gap-2 justify-end">
            <button mat-button type="button" (click)="cancelForm()">
              Cancel
            </button>
            <button
              mat-flat-button
              color="primary"
              type="submit"
              [disabled]="roleForm.invalid || isLoading"
            >
              {{ isEditing ? 'Update' : 'Create' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  }

  @if (isLoading) {
    <div class="flex justify-center py-6">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <app-data-table
      [data]="roles"
      [columns]="columns"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    ></app-data-table>
  }
</div>
