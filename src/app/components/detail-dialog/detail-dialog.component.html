<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" *ngIf="open">
  <div class="w-full max-w-md mx-4 rounded-lg bg-white shadow-xl">
    <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3">
      <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
      <button mat-icon-button (click)="onClose()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="px-4 py-4">
      <div class="rounded-lg border border-gray-200 bg-gray-50 p-4">
        @if (displayFields.length === 0) {
          <p class="text-sm text-gray-500">No details available.</p>
        } @else {
          @for (field of displayFields; track field.key) {
            <div class="mb-2 last:mb-0">
              <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">{{ field.label }}</p>
              <p class="text-sm text-gray-800">{{ field.value }}</p>
            </div>
          }
        }
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t border-gray-200 px-4 py-3">
      <button mat-stroked-button type="button" (click)="onClose()">Close</button>
    </div>
  </div>
</div>
