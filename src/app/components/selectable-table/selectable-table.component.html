<div class="overflow-x-auto">
  <table class="w-full border-collapse text-sm">
    <thead>
      <tr class="bg-gray-50 border-b">
        <th class="px-4 py-3 text-left w-12">
          <mat-checkbox
            [checked]="isAllSelected()"
            [indeterminate]="isSomeSelected()"
            (change)="toggleAll($event.checked)"
          ></mat-checkbox>
        </th>
        @for (col of columns; track col.field) {
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
            {{ col.header }}
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (item of data; track $index) {
        <tr class="border-b hover:bg-gray-50 transition-colors" [class.bg-blue-50]="isSelected(item)">
          <td class="px-4 py-3">
            <mat-checkbox
              [checked]="isSelected(item)"
              (change)="toggleRow(item, $event.checked)"
            ></mat-checkbox>
          </td>
          @for (col of columns; track col.field) {
            <td class="px-4 py-3 text-gray-700">
              @if (col.type === 'image') {
                @if (item[col.field]) {
                  <img [src]="item[col.field]" class="w-10 h-10 rounded object-cover border border-gray-200" alt="logotipo" />
                } @else {
                  <span class="text-gray-400">-</span>
                }
              } @else {
                {{ item[col.field] }}
              }
            </td>
          }
        </tr>
      }
      @if (data.length === 0) {
        <tr>
          <td [attr.colspan]="columns.length + 1" class="px-4 py-8 text-center text-gray-400">
            No hay datos disponibles
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
