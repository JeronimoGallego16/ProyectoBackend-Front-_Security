@if (open) {
  <div
    class="fixed inset-0 z-[99999] flex items-center justify-center bg-black/50 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
  >
    <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl">
      <h2 class="mb-2 text-lg font-semibold text-gray-900">{{ title }}</h2>
      <p class="mb-6 text-sm text-gray-700">{{ message }}</p>

      <div class="flex justify-end gap-2">
        <button
          mat-stroked-button
          type="button"
          (click)="cancel.emit()"
        >
          Cancel
        </button>
        <button
          mat-flat-button
          type="button"
          color="warn"
          (click)="confirm.emit()"
        >
          <mat-icon>delete</mat-icon>
          Confirm
        </button>
      </div>
    </div>
  </div>
}
